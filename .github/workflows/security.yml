name: Security

# Dependency, static-analysis and secret scanning. Uses `pull_request` (never
# `pull_request_target`), so fork PRs run without secrets or write access.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      actions: read # codeql-action reads the run's metadata (required on private repos)
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: gosec
        working-directory: backend
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 \
            -exclude-dir=docs -fmt=sarif -out=gosec.sarif -stdout -verbose=text ./...
      - name: Upload SARIF
        if: always() && hashFiles('backend/gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        # Private repos need GitHub Advanced Security for code scanning; strict once public.
        continue-on-error: ${{ github.event.repository.private == true }}
        with:
          sarif_file: backend/gosec.sarif
          category: gosec

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      # The CLI (MIT) rather than gitleaks-action, which needs a paid license on org repos.
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose .

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read # codeql-action reads the run's metadata (required on private repos)
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        name: Build backend
        working-directory: backend
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
        # Private repos need GitHub Advanced Security for code scanning; strict once public.
        continue-on-error: ${{ github.event.repository.private == true }}
        with:
          category: /language:${{ matrix.language }}
