name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Don't open a public issue. Follow [SECURITY.md](https://github.com/skryfon-org/employee-360/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as an admin
        2. Go to ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend API, Admin portal, Employee portal, Self-hosting / deployment, Docs, Other]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: How it runs (local dev, Docker Compose, Podman), OS, browser, Go/Node versions
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove secrets and personal data first.
      render: text
