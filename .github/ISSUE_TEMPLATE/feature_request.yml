name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? API, UI and data-model sketches are welcome.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [Auth & onboarding, Organisation (departments, positions, employees), Holiday calendar, Leave, Work status, Projects, Other / new module]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself
