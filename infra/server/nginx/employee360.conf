# Host nginx reverse proxy for Employee360. Replace the example.com hostnames with yours.
# Copy to /etc/nginx/conf.d/employee360.conf, then:
#   nginx -t && systemctl reload nginx
# TLS: run `certbot --nginx -d api.example.com -d admin.example.com -d app.example.com`
# afterwards; it adds the 443 server blocks and the HTTP -> HTTPS redirect.
# Backends bind to 127.0.0.1 only (see the quadlets), so nginx is the sole entry.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── API ──────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 10M;

    location / {
        proxy_pass          http://127.0.0.1:8080;
        proxy_http_version  1.1;
        proxy_set_header    Connection        $connection_upgrade;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        # The API rate-limits per client IP. It reads X-Real-IP only when the
        # direct peer is in SERVER_TRUSTED_PROXIES (api.env); set that to the
        # CIDR of the employee360 podman network, otherwise all users share
        # one bucket (see "Client IP" in docs/self-hosting.md for how to verify).
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
    }
}

# ── Admin SPA ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.example.com;

    location / {
        proxy_pass          http://127.0.0.1:3003;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}

# ── Employee SPA ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.example.com;

    location / {
        proxy_pass          http://127.0.0.1:3004;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
